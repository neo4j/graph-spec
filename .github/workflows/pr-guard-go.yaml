name: Go PR Quality Guard

on:
  pull_request:
    branches: [main]
    # Trigger on changes to the Go files (including the JSON schema) or the
    # Kotlin sources that generate them - Kotlin changes can drift go/spec.json
    # even when no go/** file was touched in the PR.
    paths:
      - 'go/**'
      - 'src/**'
      - 'build-logic/**'

jobs:
  validate:
    uses: ./.github/workflows/validate-go.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
