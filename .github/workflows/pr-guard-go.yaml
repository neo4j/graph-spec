name: Go PR Quality Guard

on:
  pull_request:
    branches: [main]
    # Trigger on changes to the Go files and the spec schema (the Go model
    # is generated from ontology-graph-spec.schema.json, so a schema-only PR must
    # run the Go drift check)
    paths:
      - 'go/**'
      - 'ontology-graph-spec.schema.json'

jobs:
  validate:
    uses: ./.github/workflows/validate-go.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
