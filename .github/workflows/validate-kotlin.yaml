name: Validate Kotlin Multiplatform

on:
  workflow_call:
    inputs:
      ref:
        description: 'The specific git commit SHA to checkout and test'
        required: true
        type: string

jobs:
  test-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Runs checks and tests for all targets (JVM, JS/TS, Native metadata)
      # plus the spotless lint gate (ktlint + license headers); the tree is
      # spotless-green and this keeps it that way.
      - name: Run Gradle Checks
        run: ./gradlew check spotlessCheck --no-daemon

      # ADR-0003: the schema is generated from the annotated Kotlin model and
      # committed; a model/annotation edit without a regenerate is drift.
      - name: Check schema drift
        run: |
          ./gradlew generateOntologyGraphSpecJsonSchema --no-daemon
          if ! git diff --exit-code -- ontology-graph-spec.schema.json; then
            echo "❌ ontology-graph-spec.schema.json is out of sync with the Kotlin model. Run ./gradlew generateOntologyGraphSpecJsonSchema locally and commit."
            exit 1
          fi
