name: Update Kotlin/Native Libs

# Run manually from the Actions tab (or `gh workflow run update-native-libs.yaml --ref <branch>`),
# selecting the branch (usually a PR branch) to rebuild the libs on.
# The rebuilt libs in go/internal/bridge/lib are committed back to that branch.
on:
  workflow_dispatch:

# Only one rebuild per branch at a time
concurrency:
  group: update-native-libs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-native-libs:
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: macos-latest  # mac-os host is needed to build and compile macosArm64 targets
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate Kotlin/Native libs
        run: ./go/scripts/generate-kotlin-native-libs.sh

      - name: Commit and push updated libs
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git add go/internal/bridge/lib
          if git diff --cached --quiet; then
            echo "Native libs are already up to date, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Kotlin/Native libs"
          git push origin "HEAD:refs/heads/${BRANCH}"
