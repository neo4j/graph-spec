      city: { type: "STRING" }
      region: { type: "STRING" }
      postalcode: { type: "STRING" }
      country: { type: "STRING" }
      phone: { type: "STRING" }
      fax: { type: "STRING" }
      homepage: { type: "STRING" }
    constraints:
      suppliers:
        type: "UNIQUE"
        label: "suppliers"
        properties: ["supplierid"]
    indexes:
      suppliers:
        type: "TEXT"
        labels: ["suppliers"]
        properties: ["supplierid"]
relationships:
