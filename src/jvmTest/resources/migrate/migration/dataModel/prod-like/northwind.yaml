    type: "CATEGORIES"
    from: { node: "products" }
    to: { node: "categories" }
  SUPPLIERS:
    type: "SUPPLIERS"
    from: { node: "products" }
    to: { node: "suppliers" }
    properties:
      productname: { type: "STRING", key: true }
    constraints:
      productname_SUPPLIERS_key:
        type: "KEY"
        properties: ["productname"]
