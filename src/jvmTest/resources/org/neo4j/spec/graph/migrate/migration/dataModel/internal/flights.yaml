schema: "https://neo4j.com/docs/ontology-graph-spec/4.0.0/schema.json"
version: "1.0.0"
id: "graph-model"
nodes:
  node0:
    labels:
      identifier: "Aircraft"
    properties:
      node0_property0: { type: "STRING", name: "aircraftCode" }
      node0_property1: { type: "STRING", name: "model" }
      node0_property2: { type: "INTEGER", name: "aircraftRange" }
    constraints:
      node0_constraint0:
        type: "UNIQUE"
        label: "Aircraft"
        properties: ["node0_property0"]
        name: "aircraftCode_Aircraft_uniq"
    extensions:
      indexes:
        node0_index0:
          type: "TEXT"
          labels: ["Aircraft"]
          properties: ["node0_property0"]
          name: "aircrafts_data-text"
    name: "Aircraft"
  node1:
    labels:
      identifier: "Airport"
    properties:
      node1_property0: { type: "STRING", name: "airportCode" }
      node1_property1: { type: "STRING", name: "airportName" }
      node1_property2: { type: "STRING", name: "city" }
      node1_property3: { type: "POINT", name: "coordinates" }
      node1_property4: { type: "STRING", name: "timezone" }
    constraints:
      node1_constraint0:
        type: "UNIQUE"
        label: "Airport"
        properties: ["node1_property0"]
        name: "airportCode_Airport_uniq"
    extensions:
      indexes:
        node1_index0:
          type: "TEXT"
          labels: ["Airport"]
          properties: ["node1_property0"]
          name: "airports_data-text"
    name: "Airport"
  node2:
    labels:
      identifier: "Booking"
    properties:
      node2_property0: { type: "STRING", name: "bookRef" }
      node2_property1: { type: "ZONED DATETIME", name: "bookDate" }
      node2_property2: { type: "FLOAT", name: "totalAmount" }
    constraints:
      node2_constraint0:
        type: "UNIQUE"
        label: "Booking"
        properties: ["node2_property0"]
        name: "bookRef_Booking_uniq"
    extensions:
      indexes:
        node2_index0:
          type: "TEXT"
          labels: ["Booking"]
          properties: ["node2_property0"]
          name: "bookings-text"
    name: "Booking"
  node3:
    labels:
      identifier: "Flight"
    properties:
      node3_property0: { type: "INTEGER", name: "flightId" }
      node3_property1: { type: "STRING", name: "flightNo" }
      node3_property2: { type: "ZONED DATETIME", name: "scheduledDeparture" }
      node3_property3: { type: "ZONED DATETIME", name: "scheduledArrival" }
      node3_property4: { type: "STRING", name: "status" }
      node3_property5: { type: "ZONED DATETIME", name: "actualDeparture" }
      node3_property6: { type: "ZONED DATETIME", name: "actualArrival" }
    constraints:
      node3_constraint0:
        type: "UNIQUE"
        label: "Flight"
        properties: ["node3_property0"]
        name: "flightId_Flight_uniq"
    extensions:
      indexes:
        node3_index0:
          type: "TEXT"
          labels: ["Flight"]
          properties: ["node3_property0"]
          name: "flights"
    name: "Flight"
  node4:
    labels:
      identifier: "Ticket"
    properties:
      node4_property0: { type: "STRING", name: "ticketNo" }
      node4_property1: { type: "STRING", name: "passengerId" }
      node4_property2: { type: "STRING", name: "passengerName" }
      node4_property3: { type: "STRING", name: "contactData" }
    constraints:
      node4_constraint0:
        type: "UNIQUE"
        label: "Ticket"
        properties: ["node4_property0"]
        name: "ticketNo_Ticket_uniq"
    extensions:
      indexes:
        node4_index0:
          type: "TEXT"
          labels: ["Ticket"]
          properties: ["node4_property0"]
          name: "tickets-text"
    name: "Ticket"
relationships:
  relationship0:
    type: "FLIGHT_USES_AIRCRAFT"
    from: { node: "node3" }
    to: { node: "node0" }
    name: "FLIGHT_USES_AIRCRAFT"
  relationship1:
    type: "FLIGHT_DEPARTS_FROM_AIRPORT"
    from: { node: "node3" }
    to: { node: "node1" }
    name: "FLIGHT_DEPARTS_FROM_AIRPORT"
  relationship2:
    type: "FLIGHT_ARRIVES_AT_AIRPORT"
    from: { node: "node3" }
    to: { node: "node1" }
    name: "FLIGHT_ARRIVES_AT_AIRPORT"
  relationship3:
    type: "FLIGHT_HAS_TICKET"
    from: { node: "node3" }
    to: { node: "node4" }
    properties:
      relationship3_property0: { type: "STRING", name: "fare_conditions" }
      relationship3_property1: { type: "FLOAT", name: "amount" }
    name: "FLIGHT_HAS_TICKET"
  relationship4:
    type: "TICKET_BELONGS_TO_BOOKING"
    from: { node: "node4" }
    to: { node: "node2" }
    name: "TICKET_BELONGS_TO_BOOKING"
extensions:
  tables:
    aircrafts_data:
      source: "cloud"
      columns:
        - name: "aircraft_code"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "model"
          type: "JSON"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "aircrafts_range"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
      primary_keys: ["aircraft_code"]
    airports_data:
      source: "cloud"
      columns:
        - name: "airport_code"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "airport_name"
          type: "JSON"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "city"
          type: "JSON"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "coordinates"
          type: "GEOMETRY"
          suggested: "POINT"
          supported: ["POINT"]
        - name: "timezone"
          type: "TEXT"
          suggested: "STRING"
          supported: ["STRING"]
      primary_keys: ["airport_code"]
    boarding_passes:
      source: "cloud"
      columns:
        - name: "ticket_no"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "flight_id"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "boarding_no"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "seat_no"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
      primary_keys: ["flight_id", "ticket_no"]
      foreign_keys:
        foreignKey1:
          columns: ["ticket_no", "flight_id"]
          references:
            table: "ticket_flights"
            columns: ["ticket_no", "flight_id"]
    bookings:
      source: "cloud"
      columns:
        - name: "book_ref"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "book_date"
          type: "TIMESTAMP"
          suggested: "ZONED DATETIME"
          supported: ["DATE", "ZONED DATETIME", "ZONED TIME", "LOCAL TIME", "LOCAL DATETIME"]
        - name: "total_amount"
          type: "DECIMAL"
          suggested: "FLOAT"
          supported: ["INTEGER", "STRING", "FLOAT"]
      primary_keys: ["book_ref"]
    flights:
      source: "cloud"
      columns:
        - name: "flight_id"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "flight_no"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "scheduled_departure"
          type: "TIMESTAMP"
          suggested: "ZONED DATETIME"
          supported: ["DATE", "ZONED DATETIME", "ZONED TIME", "LOCAL TIME", "LOCAL DATETIME"]
        - name: "scheduled_arrival"
          type: "TIMESTAMP"
          suggested: "ZONED DATETIME"
          supported: ["DATE", "ZONED DATETIME", "ZONED TIME", "LOCAL TIME", "LOCAL DATETIME"]
        - name: "departure_airport"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "arrival_airport"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "status"
          type: "TEXT"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "aircraft_code"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "actual_departure"
          type: "TIMESTAMP"
          suggested: "ZONED DATETIME"
          supported: ["DATE", "ZONED DATETIME", "ZONED TIME", "LOCAL TIME", "LOCAL DATETIME"]
        - name: "actual_arrival"
          type: "TIMESTAMP"
          suggested: "ZONED DATETIME"
          supported: ["DATE", "ZONED DATETIME", "ZONED TIME", "LOCAL TIME", "LOCAL DATETIME"]
      primary_keys: ["flight_id"]
      foreign_keys:
        foreignKey1:
          columns: ["aircraft_code"]
          references:
            table: "aircrafts_data"
            columns: ["aircraft_code"]
        foreignKey2:
          columns: ["departure_airport", "arrival_airport"]
          references:
            table: "airports_data"
            columns: ["airport_code"]
    seats:
      source: "cloud"
      columns:
        - name: "aircraft_code"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "seat_no"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "fare_conditions"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
      primary_keys: ["aircraft_code", "seat_no"]
      foreign_keys:
        foreignKey1:
          columns: ["aircraft_code"]
          references:
            table: "aircrafts_data"
            columns: ["aircraft_code"]
    ticket_flights:
      source: "cloud"
      columns:
        - name: "ticket_no"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "flight_id"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "fare_conditions"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "amount"
          type: "DECIMAL"
          suggested: "FLOAT"
          supported: ["INTEGER", "STRING", "FLOAT"]
      primary_keys: ["flight_id", "ticket_no"]
      foreign_keys:
        foreignKey1:
          columns: ["flight_id"]
          references:
            table: "flights"
            columns: ["flight_id"]
        foreignKey2:
          columns: ["ticket_no"]
          references:
            table: "tickets"
            columns: ["ticket_no"]
    tickets:
      source: "cloud"
      columns:
        - name: "ticket_no"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "book_ref"
          type: "CHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "passenger_id"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "passenger_name"
          type: "TEXT"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "contact_data"
          type: "JSON"
          suggested: "STRING"
          supported: ["STRING"]
      primary_keys: ["ticket_no"]
      foreign_keys:
        foreignKey1:
          columns: ["book_ref"]
          references:
            table: "bookings"
            columns: ["book_ref"]
  mappings:
    mapping0:
      - type: "NODE"
        node: "node0"
        table: "aircrafts_data"
        properties:
          node0_property0: { column: "aircraft_code" }
          node0_property1: { column: "model" }
          node0_property2: { column: "aircrafts_range" }
        key: ["node0_property0"]
      - type: "NODE"
        node: "node1"
        table: "airports_data"
        properties:
          node1_property0: { column: "airport_code" }
          node1_property1: { column: "airport_name" }
          node1_property2: { column: "city" }
          node1_property3: { column: "coordinates" }
          node1_property4: { column: "timezone" }
        key: ["node1_property0"]
      - type: "NODE"
        node: "node2"
        table: "bookings"
        properties:
          node2_property0: { column: "book_ref" }
          node2_property1: { column: "book_date" }
          node2_property2: { column: "total_amount" }
        key: ["node2_property0"]
      - type: "NODE"
        node: "node3"
        table: "flights"
        properties:
          node3_property0: { column: "flight_id" }
          node3_property1: { column: "flight_no" }
          node3_property2: { column: "scheduled_departure" }
          node3_property3: { column: "scheduled_arrival" }
          node3_property4: { column: "status" }
          node3_property5: { column: "actual_departure" }
          node3_property6: { column: "actual_arrival" }
        key: ["node3_property0"]
      - type: "NODE"
        node: "node4"
        table: "tickets"
        properties:
          node4_property0: { column: "ticket_no" }
          node4_property1: { column: "passenger_id" }
          node4_property2: { column: "passenger_name" }
          node4_property3: { column: "contact_data" }
        key: ["node4_property0"]
      - type: "RELATIONSHIP"
        relationship: "relationship0"
        table: "flights"
        from_node:
          properties:
            node3_property0: { column: "flight_id" }
        to_node:
          properties:
            node0_property0: { column: "aircraft_code" }
      - type: "RELATIONSHIP"
        relationship: "relationship1"
        table: "flights"
        from_node:
          properties:
            node3_property0: { column: "flight_id" }
        to_node:
          properties:
            node1_property0: { column: "departure_airport" }
      - type: "RELATIONSHIP"
        relationship: "relationship2"
        table: "flights"
        from_node:
          properties:
            node3_property0: { column: "flight_id" }
        to_node:
          properties:
            node1_property0: { column: "arrival_airport" }
      - type: "RELATIONSHIP"
        relationship: "relationship3"
        table: "ticket_flights"
        from_node:
          properties:
            node3_property0: { column: "flight_id" }
        to_node:
          properties:
            node4_property0: { column: "ticket_no" }
        properties:
          relationship3_property0: { column: "fare_conditions" }
          relationship3_property1: { column: "amount" }
      - type: "RELATIONSHIP"
        relationship: "relationship4"
        table: "tickets"
        from_node:
          properties:
            node4_property0: { column: "ticket_no" }
        to_node:
          properties:
            node2_property0: { column: "book_ref" }
