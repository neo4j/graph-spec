schema: "https://neo4j.com/docs/ontology-graph-spec/4.0.0/schema.json"
version: "1.0.0"
id: "graph-model"
nodes:
  node0:
    labels:
      identifier: "document"
    properties:
      node0_property0: { type: "INTEGER", name: "documentid" }
      node0_property1: { type: "VECTOR<FLOAT>", dimension: 123, name: "embedding" }
      node0_property2: { type: "VECTOR<FLOAT>", name: "legacyembedding" }
    extensions:
      indexes:
        node0_index0:
          type: "VECTOR"
          labels: ["document"]
          properties: ["node0_property1"]
          options:
            type: "VECTOR"
            vector.dimensions: 123
            vector.similarity_function: "euclidean"
          name: "document_embedding"
    name: "document"
extensions:
  tables:
    document:
      source: "cloud"
      columns:
        - name: "documentid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER"]
        - name: "embedding"
          type: "VECTOR"
          suggested: "VECTOR<FLOAT>"
          supported: ["VECTOR<FLOAT>", "VECTOR<FLOAT32>"]
          dimension: 123
        - name: "legacyembedding"
          type: "VECTOR"
          suggested: "VECTOR<FLOAT>"
          supported: ["VECTOR<FLOAT>"]
      primary_keys: ["documentid"]
  mappings:
    mapping0:
      - type: "NODE"
        node: "node0"
        table: "document"
        properties:
          node0_property0: { column: "documentid" }
          node0_property1: { column: "embedding" }
          node0_property2: { column: "legacyembedding" }
        key: ["node0_property0"]
