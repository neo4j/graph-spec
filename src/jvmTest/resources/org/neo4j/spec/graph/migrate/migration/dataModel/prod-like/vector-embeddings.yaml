schema: "https://neo4j.com/docs/ontology-graph-spec/1.0.0/schema.json"
version: "1.0.0"
id: "graph-model"
nodes:
  document:
    label: "document"
    properties:
      documentid: { type: "INTEGER" }
      embedding: { type: "VECTOR<FLOAT>", dimension: 123 }
      legacyembedding: { type: "VECTOR<FLOAT>" }
    extensions:
      indexes:
        document_embedding:
          type: "VECTOR"
          labels: ["document"]
          properties: ["embedding"]
          options:
            type: "VECTOR"
            vector.dimensions: 123
            vector.similarity_function: "euclidean"
extensions:
  tables:
    document:
      source: "cloud"
      columns:
        - name: "documentid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER"]
        - name: "embedding"
          type: "VECTOR"
          suggested: "VECTOR<FLOAT>"
          supported: ["VECTOR<FLOAT>", "VECTOR<FLOAT32>"]
          dimension: 123
        - name: "legacyembedding"
          type: "VECTOR"
          suggested: "VECTOR<FLOAT>"
          supported: ["VECTOR<FLOAT>"]
      primary_keys: ["documentid"]
  mappings:
    mapping0:
      - type: "NODE"
        node: "document"
        table: "document"
        properties:
          documentid: { column: "documentid" }
          embedding: { column: "embedding" }
          legacyembedding: { column: "legacyembedding" }
        key: ["documentid"]
