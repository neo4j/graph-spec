schema: "https://neo4j.com/docs/ontology-graph-spec/4.0.0/schema.json"
version: "1.0.0"
id: "graph-model"
nodes:
  categories:
    label: "categories"
    properties:
      categoryid: { type: "INTEGER", unique: true }
      categoryname: { type: "STRING" }
      description: { type: "STRING" }
      picture: { type: "STRING" }
    extensions:
      indexes:
        categories:
          type: "TEXT"
          labels: ["categories"]
          properties: ["categoryid"]
      display:
        x: -100.123
        y: 200.0
  products:
    label: "products"
    properties:
      productid: { type: "INTEGER", unique: true }
      productname: { type: "STRING" }
      quantityperunit: { type: "STRING" }
      unitprice: { type: "FLOAT" }
      unitsinstock: { type: "INTEGER" }
      unitsonorder: { type: "INTEGER" }
      reorderlevel: { type: "INTEGER" }
      discontinued: { type: "INTEGER" }
    extensions:
      indexes:
        products:
          type: "TEXT"
          labels: ["products"]
          properties: ["productid"]
  suppliers:
    label: "suppliers"
    properties:
      supplierid: { type: "INTEGER", unique: true }
      companyname: { type: "STRING" }
      contactname: { type: "STRING" }
      contacttitle: { type: "STRING" }
      address: { type: "STRING" }
      city: { type: "STRING" }
      region: { type: "STRING" }
      postalcode: { type: "STRING" }
      country: { type: "STRING" }
      phone: { type: "STRING" }
      fax: { type: "STRING" }
      homepage: { type: "STRING" }
    extensions:
      indexes:
        suppliers:
          type: "TEXT"
          labels: ["suppliers"]
          properties: ["supplierid"]
relationships:
  CATEGORIES:
    type: "CATEGORIES"
    from: { node: "products" }
    to: { node: "categories" }
  SUPPLIERS:
    type: "SUPPLIERS"
    from: { node: "products" }
    to: { node: "suppliers" }
extensions:
  tables:
    categories:
      source: "cloud"
      columns:
        - name: "categoryid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "categoryname"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "description"
          type: "TEXT"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "picture"
          type: "TEXT"
          suggested: "STRING"
          supported: ["STRING"]
      primary_keys: ["categoryid"]
    orders:
      source: "cloud"
      columns:
        - name: "orderid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "productid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "unitprice"
          type: "DOUBLE"
          suggested: "FLOAT"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "quantity"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "discount"
          type: "DOUBLE"
          suggested: "FLOAT"
          supported: ["INTEGER", "STRING", "FLOAT"]
      primary_keys: ["orderid", "productid"]
      foreign_keys:
        foreignKey1:
          columns: ["productid"]
          references:
            table: "products"
            columns: ["productid"]
    products:
      source: "cloud"
      columns:
        - name: "productid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "productname"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "supplierid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "categoryid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "quantityperunit"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "unitprice"
          type: "DOUBLE"
          suggested: "FLOAT"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "unitsinstock"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "unitsonorder"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "reorderlevel"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "discontinued"
          type: "BIT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT", "BOOLEAN"]
      primary_keys: ["productid"]
      foreign_keys:
        foreignKey1:
          columns: ["categoryid"]
          references:
            table: "categories"
            columns: ["categoryid"]
        foreignKey2:
          columns: ["supplierid"]
          references:
            table: "suppliers"
            columns: ["supplierid"]
    suppliers:
      source: "cloud"
      columns:
        - name: "supplierid"
          type: "INT"
          suggested: "INTEGER"
          supported: ["INTEGER", "STRING", "FLOAT"]
        - name: "companyname"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "contactname"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "contacttitle"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "address"
          type: "TEXT"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "city"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "region"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "postalcode"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "country"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "phone"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "fax"
          type: "VARCHAR"
          suggested: "STRING"
          supported: ["STRING"]
        - name: "homepage"
          type: "TEXT"
          suggested: "STRING"
          supported: ["STRING"]
      primary_keys: ["supplierid"]
  mappings:
    mapping0:
      - type: "NODE"
        node: "categories"
        table: "categories"
        properties:
          categoryid: { column: "categoryid" }
          categoryname: { column: "categoryname" }
          description: { column: "description" }
          picture: { column: "picture" }
        key: ["categoryid"]
      - type: "NODE"
        node: "products"
        table: "products"
        properties:
          productid: { column: "productid" }
          productname: { column: "productname" }
          quantityperunit: { column: "quantityperunit" }
          unitprice: { column: "unitprice" }
          unitsinstock: { column: "unitsinstock" }
          unitsonorder: { column: "unitsonorder" }
          reorderlevel: { column: "reorderlevel" }
          discontinued: { column: "discontinued" }
        key: ["productid"]
      - type: "NODE"
        node: "suppliers"
        table: "suppliers"
        properties:
          supplierid: { column: "supplierid" }
          companyname: { column: "companyname" }
          contactname: { column: "contactname" }
          contacttitle: { column: "contacttitle" }
          address: { column: "address" }
          city: { column: "city" }
          region: { column: "region" }
          postalcode: { column: "postalcode" }
          country: { column: "country" }
          phone: { column: "phone" }
          fax: { column: "fax" }
          homepage: { column: "homepage" }
        key: ["supplierid"]
      - type: "RELATIONSHIP"
        relationship: "CATEGORIES"
        table: "products"
        from_node:
          properties:
            productid: { column: "productid" }
        to_node:
          properties:
            categoryid: { column: "categoryid" }
      - type: "RELATIONSHIP"
        relationship: "SUPPLIERS"
        table: "products"
        from_node:
          properties:
            productid: { column: "productid" }
        to_node:
          properties:
            supplierid: { column: "supplierid" }
