$schema: https://neo4j.com/ontology-spec/1.0.0/schema.json
id: 3f8a4c2e-9b1d-4e7a-a5c3-2d8f1b6e9a04
version: 3
name: movies
description: Movie domain ontology
nodes:
  Actor:
    label: Actor
    description: A person who acts in films
    aliases:
      - Performer
    properties:
      id:
        type: STRING
        key: true
      name:
        type: STRING
        mustExist: true
        description: Stage name
      status:
        type: STRING
        one_of:
          - active
          - retired
      imdb_id:
        type: STRING
        pattern: ^tt[0-9]{7,8}$
        unique: true
    extensions_map:
      neo4j:index:
        name: actor_names
        properties:
          - name
      neo4j:display:
        color: "#e06209"
        caption: name
  person-id-field:
    reference: https://example.com/external/Person
    label: Person
    properties:
      id:
        type: STRING
        key: true
  employee:
    labels:
      identifier: Employee
      implied:
        - Person
      optional:
        - Contractor
    properties:
      employee_id:
        type: STRING
        key: true
  Movie:
    label: Movie
    properties:
      id:
        type: STRING
        key: true
      title:
        type: STRING
        mustExist: true
      embedding:
        type:
          kind: vector
          items: FLOAT
          dimension: 1042
        description: Plot embedding
        reference: https://example.com/external/embedding
  Studio:
    label: Studio
    properties:
      id:
        type: STRING
        key: true
      name:
        type: STRING
        mustExist: true
relationships:
  ACTED_IN:
    type: ACTED_IN
    from:
      node: Actor
    to:
      node: Movie
    cardinality_type: MANY_TO_ONE
    description: Filmography
    properties:
      roles:
        type:
          kind: list
          items: STRING
    extensions_map:
      neo4j:tools:
        - kind: canonicalQuery
          name: findCoActors
          description: Actors who shared a film with a given actor
          cypher: MATCH (a:Actor)-[:ACTED_IN]->(m:Movie)<-[:ACTED_IN]-(co:Actor) WHERE a.name = $name RETURN co
  PRODUCED_STUDIO:
    type: PRODUCED
    from:
      node: Studio
    to:
      node: Movie
    cardinality_type: ONE_TO_MANY
  PRODUCED_PERSON:
    type: PRODUCED
    from:
      node: person-id-field
    to:
      node: Movie
    cardinality_type: MANY_TO_ONE
    description: Individual producer credit
extensions_map:
  neo4j-importer:table:
    $schema: https://neo4j.com/ontology-spec/extensions/neo4j-importer-table/0.1.0/schema.json
    name: actors
    source: sql/postgres
    columns:
      actor_id:
        type: varchar
  neo4j-importer:mapping:
    kind: node
    node: Actor
    table: actors
    key:
      - actor_id
