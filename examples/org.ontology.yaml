$schema: https://neo4j.com/ontology-spec/1.0.0/schema.json
id: c7d21f58-3a6b-4c9e-b2d8-5e1f7a03c946
version: 1
name: org
description: "Organisation ontology: people, employment and structure. Exercises the fields the movies example does not."
nodes:
  Person:
    label: Person
    description: A human being known to the organisation
    properties:
      id:
        type: STRING
        key: true
      email:
        type: STRING
        unique: true
        pattern: ^[^@\s]+@[^@\s]+$
        description: Primary work email
        extensions:
          custom:
            - type: governance:pii
              definition:
                classification: restricted
                owner: people-ops
      name:
        type: STRING
        mustExist: true
  Employee:
    labels:
      identifier: Employee
      implied:
        - Person
    description: A person employed by the organisation
    aliases:
      - Staff member
    properties:
      employee_id:
        type: STRING
        key: true
      skills:
        type: LIST<STRING>
        aliases:
          - competencies
      face_embedding:
        type: VECTOR<FLOAT>
        description: Badge-photo embedding; dimension unconstrained at authoring time
  Contractor:
    labels:
      identifier: Contractor
      implied:
        - Person
    properties:
      contract_id:
        type: STRING
        key: true
  Department:
    label: Department
    properties:
      name:
        type: STRING
        mustExist: true
      region:
        type: STRING
        one_of:
          - EMEA
          - AMER
          - APAC
      cost_center:
        type: INTEGER
    constraints:
      - constraint_type: key
        properties:
          - name
          - region
    extensions:
      neo4j:display:
        color: "#4c9aff"
        icon: building
      neo4j:index:
        name: department_name_region
        kind: range
        properties:
          - name
          - region
relationships:
  WORKS_IN_EMPLOYEE:
    type: WORKS_IN
    from:
      node: Employee
    to:
      node: Department
      max_count: 1
    description: Current organisational home
    properties:
      since:
        type: DATE
      fte:
        type: FLOAT
        description: Fraction of full-time employment
    tools:
      - type: canonicalQuery
        name: colleaguesOf
        description: Colleagues of an employee across their departments
        cypher: MATCH (e:Employee)-[:WORKS_IN]->(d:Department)<-[:WORKS_IN]-(c:Employee) WHERE e.employee_id = $id RETURN c
  WORKS_IN_CONTRACTOR:
    type: WORKS_IN
    from:
      node: Contractor
    to:
      node: Department
      max_count: 1
    description: Current organisational home
    properties:
      po_number:
        type: STRING
        pattern: ^PO-[0-9]{6}$
  MANAGES:
    type: MANAGES
    from:
      node: Employee
      max_count: 1
    to:
      node: Department
      max_count: 1
    constraints:
      - constraint_type: unique
        name: unique_manager_since_note
        properties:
          - since
          - note
    properties:
      since:
        type: DATE
        mustExist: true
      note:
        type: STRING
  REPORTS_TO:
    type: REPORTS_TO
    from:
      node: Employee
    to:
      node: Employee
      max_count: 1
  SUPPORTS:
    type: SUPPORTS
    from:
      node: Department
    to:
      node: Department
    description: Cross-department service relationships
  STAFFS:
    type: STAFFS
    from:
      node: Department
      max_count: 1
    to:
      node: Contractor
extensions:
  neo4j-importer:table:
    name: employees
    source: hr/workday
    columns:
      employee_id:
        type: varchar
      full_name:
        type: varchar
  custom:
    - type: governance:retention
      $schema: https://example.com/ontology-extensions/governance-retention/0.1.0/schema.json
      definition:
        review_after_days: 365
